# Render Blueprint: creates the TrustPass web service and its PostgreSQL
# database in one step. Secrets are generated by Render and never stored in
# this repository. See README > Deployment.
services:
  - type: web
    name: trustpass
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustpass-db
          property: connectionString
      # 256-bit random values generated by Render on first deploy.
      - key: MASTER_KEY
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: ISSUER_SIGNING_SEED
        generateValue: true
      # Encrypted files are stored as ciphertext in PostgreSQL (free plan has no persistent disk).
      - key: STORAGE_DRIVER
        value: database
      - key: GEO_PROVIDER
        value: mmdb
      # Render's internal proxies use private addresses: trust only those, so the visitor is the
      # right-most public address in X-Forwarded-For. Confirm in Admin > Health after deploy.
      - key: TRUST_PROXY
        value: "loopback,linklocal,uniquelocal,100.64.0.0/10"
      - key: MAIL_TRANSPORT
        value: none
      # You type these in the Render dashboard during setup (12+ character password).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: trustpass-db
    plan: free
    region: frankfurt
    databaseName: trustpass
    user: trustpass
