# Design review helper for the UI redesign branch: runs the visual tour (phone + desktop) and
# publishes the screenshots to the scratch branch "ui-preview" so they can be reviewed without
# downloading Actions artifacts. Contains test data only; no secrets are used.
name: ui-preview
on:
  push:
    branches: ['claude/ui-turquoise', 'claude/final-improvements', 'claude/sensitive-info', 'claude/ios-pdfjs-fix', 'claude/stage1-ui']
permissions:
  contents: write
jobs:
  screens:
    if: ${{ !contains(github.event.head_commit.message, '[deps-bot]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustpass
          POSTGRES_PASSWORD: trustpass_dev
          POSTGRES_DB: trustpass_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trustpass/api db:generate
      - run: pnpm --filter @trustpass/web build
      - run: pnpm --filter @trustpass/e2e exec playwright install --with-deps chromium
      - name: Visual tour
        run: pnpm --filter @trustpass/e2e exec playwright test tests/visual-tour.spec.ts
      - name: Publish screenshots to the ui-preview branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/preview
          cp e2e/test-results/tour/*.jpg /tmp/preview/ 2>/dev/null || true
          cd /tmp/preview
          git init -q -b ui-preview
          git config user.name "ui-preview-bot"
          git config user.email "ui-preview-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Screens for ${GITHUB_SHA::7}" --allow-empty
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-preview
