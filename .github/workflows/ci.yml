name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustpass
          POSTGRES_PASSWORD: trustpass_dev
          POSTGRES_DB: trustpass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://trustpass:trustpass_dev@localhost:5432/trustpass_test
      # Optional: live Google Cloud KMS tests (test key and test service account only; never
      # production's). Empty when the secrets are not set, and the live suite is skipped.
      GCP_TEST_KMS_KEY_NAME: ${{ secrets.GCP_TEST_KMS_KEY_NAME }}
      GCP_TEST_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_TEST_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trustpass/api db:generate
      - name: Type check
        run: pnpm typecheck
      - name: Unit, integration and security tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustpass
          POSTGRES_PASSWORD: trustpass_dev
          POSTGRES_DB: trustpass_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trustpass/api db:generate
      - run: pnpm --filter @trustpass/web build
      - run: pnpm --filter @trustpass/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (phone and desktop)
        run: pnpm e2e
      - name: Print tour screenshots (preview branch only)
        if: always()
        run: for f in e2e/test-results/tour/*.jpg; do echo "IMG $(basename $f) $(base64 -w0 $f)"; done
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The open-source gitleaks CLI needs no licence key (the GitHub Action does for organizations).
      - name: Scan git history for secrets
        run: docker run -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
