# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trustpass
      POSTGRES_PASSWORD: trustpass_dev
      POSTGRES_DB: trustpass_dev
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']
volumes:
  pgdata:
